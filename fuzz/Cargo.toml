[package]
name = "rasterrocket-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# A workspace of its own: the fuzz build needs nightly sanitizer flags that
# must not reach the main workspace, and an enclosing checkout must not claim
# this package.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
pdf_interp    = { package = "rasterrocket-interp", path = "../crates/pdf_interp" }
pdf           = { package = "rasterrocket-parser", path = "../crates/pdf" }

# Direct dependency so we can fuzz hayro-jbig2 both through pdf_interp
# and standalone (raw segment data without a PDF wrapper).
hayro-jbig2 = { path = "../crates/jbig2", default-features = false }

[[bin]]
name = "fuzz_ccitt"
path = "fuzz_targets/fuzz_ccitt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_jbig2"
path = "fuzz_targets/fuzz_jbig2.rs"
test = false
doc = false
bench = false
