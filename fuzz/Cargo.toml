[package]
name = "rasterrocket-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
# The main workspace's minimum toolchain; the fuzz targets build on nightly.
rust-version = "1.100"

[package.metadata]
cargo-fuzz = true

# A workspace of its own: the fuzz build needs nightly sanitizer flags that
# must not reach the main workspace, and an enclosing checkout must not claim
# this package.
[workspace]

# The local zune-jpeg fork also decodes the JPEG strips the tiff crate
# reads, as in the main workspace.
[patch.crates-io]
zune-jpeg = { path = "../crates/zune_jpeg" }

[lib]
path = "src/lib.rs"
test = false
doc = false

[dependencies]
libfuzzer-sys  = "0.4"
font           = { package = "rasterrocket-font", path = "../crates/font" }
pdf_interp     = { package = "rasterrocket-interp", path = "../crates/pdf_interp" }
pdf            = { package = "rasterrocket-parser", path = "../crates/pdf" }
rasterrocket   = { path = "../crates/pdf_raster" }
camera         = { package = "rasterrocket-camera", path = "../crates/camera" }
# Without the AV1 decoder's assembly kernels: the sanitizer instruments the
# Rust decoder, and the build needs no nasm.
comic          = { package = "rasterrocket-comic", path = "../crates/comic", default-features = false }
hayro-jpeg2000 = { path = "../crates/jpeg2000" }
zune-jpeg      = { path = "../crates/zune_jpeg" }

[[bin]]
name = "fuzz_ccitt"
path = "fuzz_targets/fuzz_ccitt.rs"
test = false
doc = false
bench = false

