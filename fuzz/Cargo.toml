[package]
name = "rasterrocket-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# A workspace of its own: the fuzz build needs nightly sanitizer flags that
# must not reach the main workspace, and an enclosing checkout must not claim
# this package.
[workspace]

[lib]
path = "src/lib.rs"
test = false
doc = false

[dependencies]
libfuzzer-sys = "0.4"
font          = { package = "rasterrocket-font", path = "../crates/font" }
pdf_interp    = { package = "rasterrocket-interp", path = "../crates/pdf_interp" }
pdf           = { package = "rasterrocket-parser", path = "../crates/pdf" }
rasterrocket  = { path = "../crates/pdf_raster" }

[[bin]]
name = "fuzz_ccitt"
path = "fuzz_targets/fuzz_ccitt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_jbig2"
path = "fuzz_targets/fuzz_jbig2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cmap"
path = "fuzz_targets/fuzz_cmap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_content"
path = "fuzz_targets/fuzz_content.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decrypt"
path = "fuzz_targets/fuzz_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_document"
path = "fuzz_targets/fuzz_document.rs"
test = false
doc = false
