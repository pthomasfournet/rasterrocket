[package]
publish = false
name             = "rasterrocket-encode"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
readme.workspace     = true
description          = "PPM/PGM/PBM/PNG output and a baseline grayscale JPEG encoder for the rasterrocket PDF renderer"
keywords             = ["pdf", "ppm", "png", "encode", "image"]
categories           = ["multimedia::images", "encoding"]

[dependencies]
color  = { package = "rasterrocket-color",  path = "../color",  version = "2.1" }
raster = { package = "rasterrocket-render", path = "../raster", version = "2.1" }

# PNG output — pure Rust, no system libs required.
png = "0.18"

# JPEG output — pure Rust, no system libs. (MIT OR Apache-2.0) AND IJG.
jpeg-encoder = "0.7"

# TIFF strip compression: zlib Deflate and TIFF-variant LZW, pure Rust.
flate2 = { workspace = true }
weezl = { workspace = true }
# CCITT Group 3 and Group 4 fax coding: the local ccitt fork.
hayro-ccitt = { path = "../ccitt" }

[dev-dependencies]
# Decodes the JPEG output in tests.
zune-jpeg = { workspace = true }
# Reads the TIFF output back in tests: an independent decoder.
tiff = { workspace = true }

[lints]
workspace = true
