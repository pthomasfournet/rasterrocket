[package]
publish = false
name    = "bench"
version = "2.5.0"
edition = "2024"
rust-version.workspace = true

[[bin]]
name = "bench"
path = "src/main.rs"

[[bin]]
name = "contest_v11"
path = "src/contest_v11/main.rs"

[[bin]]
name = "os_bench"
path = "src/os_bench/main.rs"

[[bin]]
name = "paint_trace"
path = "src/paint_trace/main.rs"

[[bin]]
name = "page_gpu_bench"
path = "src/page_gpu/main.rs"

[features]
# Vulkan page-raster benchmark (`page_gpu_bench`): the library's GPU page
# path, on the gpu crate's Vulkan backend.
vulkan = ["dep:gpu", "gpu/vulkan", "pdf_raster/vulkan"]
# The same benchmark on the gpu crate's Direct3D 12 backend (Windows only).
d3d12  = ["dep:gpu", "gpu/d3d12", "pdf_raster/d3d12"]

[dependencies]
raster     = { package = "rasterrocket-render", path = "../raster" }
color      = { package = "rasterrocket-color",  path = "../color" }
encode     = { package = "rasterrocket-encode", path = "../encode" }
pdf_raster = { package = "rasterrocket",        path = "../pdf_raster" }
vello_cpu  = "0.4.0"
bytemuck   = { workspace = true }
gpu        = { package = "rasterrocket-gpu",    path = "../gpu", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "allow"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
