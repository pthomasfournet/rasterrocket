# Local fork of zune-jpeg (https://github.com/etemesi254/zune-image), vendored
# from upstream commit 9706202c268cd69276a4a1144261a988a0d77440 (2026-05-01,
# crate version 0.5.15 plus unreleased changes).  Licence: MIT OR Apache-2.0
# OR Zlib (see LICENSE-MIT, LICENSE-APACHE, LICENSE-ZLIB).  Changes made here
# are ours; see CHANGES.md.
[package]
name = "zune-jpeg"
version = "0.5.15"
authors = ["caleb <etemesicaleb@gmail.com>"]
edition = "2021"
rust-version.workspace = true
description = "A fast, correct and safe jpeg decoder (local fork)."
license = "MIT OR Apache-2.0 OR Zlib"
repository = "https://github.com/etemesi254/zune-image/tree/dev/crates/zune-jpeg"
readme = "README.md"
publish = false

[features]
x86 = []
neon = []
std = ["zune-core/std"]
# NOTE: portable_simd requires a nightly toolchain.
portable_simd = []
# Arithmetic entropy coding (SOF9, SOF10).
arith = []
log = ["zune-core/log"]
default = ["x86", "neon", "std"]

[dependencies]
zune-core = { version = "0.5.1" }

# Not part of rasterrocket's releases: the version stays that of the
# vendored upstream base.
[package.metadata.release]
release = false

# Upstream code is linted with clippy's defaults.
[lints]
