# Local fork of harfrust (https://github.com/harfbuzz/harfrust, directory
# `harfrust/`), vendored from upstream commit
# bdd55a548fb3baaaed0e0633402909858858170a (2026-11-01, crate version 0.15.0).
# Licence: MIT (see LICENSE).  Changes made here are ours; see CHANGES.md.
[package]
name = "harfrust"
version = "0.15.0"
description = "A complete HarfBuzz shaping algorithm port to Rust."
readme = "README.md"
keywords = ["text", "shaping", "opentype", "truetype"]
categories = ["text-processing"]

rust-version.workspace = true
edition = "2021"
license = "MIT"
repository = "https://github.com/harfbuzz/harfrust"
publish = false

[dependencies]
read-fonts = { version = "0.46.0", path = "../read_fonts", default-features = false }
spin = { version = "0.12.3", default-features = false, features = ["once"], optional = true }
bitflags = "2.9"
bytemuck = { version = "1.22", features = ["extern_crate_alloc", "min_const_generics"] }
core_maths = { version = "0.1", optional = true }
smallvec = "1.14"
yoke = { version = "0.8.0", default-features = false, features = ["alloc", "derive"] }
icu_properties = { version = "=2.2.0", optional = true }
icu_normalizer = { version = "2.2.0", optional = true }

[features]
default = ["std"]
std = ["read-fonts/std"]
libm = ["dep:core_maths", "dep:spin", "read-fonts/libm"]
icu = ["dep:icu_properties", "dep:icu_normalizer"]
# Compile shaping messages and buffer callbacks; disabled by default.
tracing = []

[lib]
bench = false


# Not part of rasterrocket's releases: the version stays that of the
# vendored upstream base.
[package.metadata.release]
release = false
