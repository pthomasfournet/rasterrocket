# Local fork of hayro-jpeg2000 (https://github.com/LaurenzV/hayro), vendored
# from upstream commit 79926198e557e06fea8a8edcb0bc577eb0130ec5 (2026-10-23,
# crate version 0.4.1 plus unreleased changes).  Licence: Apache-2.0 OR MIT
# (see LICENSE-APACHE, LICENSE-MIT).  Changes made here are ours; see
# CHANGES.md.
[package]
name = "hayro-jpeg2000"
version = "0.4.1"
description = "A memory-safe, pure-Rust JPEG 2000 decoder (local fork)."
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
readme = "README.md"
publish = false
autotests = false

[dependencies]
log = { workspace = true, optional = true }
fearless_simd = { version = "1.0.0", optional = true }
image = { version = "0.25", default-features = false, optional = true }
moxcms = { version = "0.8.1", optional = true }

[features]
default = ["std", "simd"]
# Enable std library support. Disable for no_std environments.
std = []
# Enable SIMD via `fearless_simd`.
simd = ["fearless_simd", "std"]
# Integration with the `image` crate (used by the test suite only).
image = ["dep:image", "dep:moxcms", "std"]
# Enable logging via the `log` crate.
logging = ["dep:log"]

# Upstream code is linted with clippy's defaults, minus findings in code we
# have not changed.
[lints.clippy]
too_many_arguments = "allow"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18.1"

[[test]]
name = "tests"
path = "tests/main.rs"
required-features = ["image"]
