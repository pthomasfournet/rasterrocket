# Test fonts for the local read-fonts and skrifa forks: a copy of
# font-test-data (https://github.com/googlefonts/fontations, directory
# `font-test-data/`) at upstream commit
# 1d1672367c7909013b4e366085d68d5ad612ee67 (2026-11-02, crate version 0.10.1).
# Only test suites (theirs and rasterrocket-font's) depend on it.
# Licence: MIT OR Apache-2.0 (see LICENSE-APACHE, LICENSE-MIT).
# Changed from upstream: rust-version is inherited from the workspace.
[package]
name = "font-test-data"
version = "0.10.1"
description = "Test data for the fontations crates"
readme = "README.md"

rust-version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/googlefonts/fontations"
publish = false

# do NOT create circular deps, even with dev-dependencies. It messes with google3 import.
[dependencies]
font-types = "0.12.7"

# Not part of rasterrocket's releases: the version stays that of the
# vendored upstream base.
[package.metadata.release]
release = false
