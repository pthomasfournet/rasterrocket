[package]
publish = false
name        = "rasterrocket-interp"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
readme.workspace     = true
description = "PDF content-stream interpreter: the render path of rasterrocket"
keywords    = ["pdf", "interpreter", "renderer", "fonts", "images"]
categories  = ["parser-implementations", "rendering", "multimedia::images"]

[features]
# GPU features pull the path-only internal `rasterrocket-gpu` crate (publish = false)
# and are not available on crates.io.  Each feature activates `dep:gpu` so the
# optional dependency is linked, then forwards to the matching gpu-crate feature
# (where one exists).
# `gpu-icc` has no matching gpu-crate feature — it gates code that calls into
# the gpu crate's default (no-feature) surface (`GpuCtx`, the ICC CLUT kernel).
nvjpeg           = ["dep:gpu", "gpu/nvjpeg"]
nvjpeg2k         = ["dep:gpu", "gpu/nvjpeg2k"]
# Tests that need a CUDA device and fail without one (the nvJPEG2000
# 16-bit equivalence gate, with `nvjpeg2k`).
gpu-validation   = ["dep:gpu", "gpu/gpu-validation"]
vaapi            = ["dep:gpu", "gpu/vaapi"]
gpu-icc          = ["dep:gpu"]
cache            = ["dep:gpu", "gpu/cache"]
vulkan           = ["dep:gpu", "gpu/vulkan"]
# Noto fallback faces for Greek, Cyrillic, Hebrew, Arabic, Devanagari, Thai,
# Bengali, Tamil, Armenian, Georgian, Ethiopic and symbols compiled into the
# binary (fonts/noto/, ~0.75 MB), drawn when no installed face covers a
# character.
bundled-fonts    = []

[dependencies]
gpu      = { package = "rasterrocket-gpu",    path = "../gpu",    optional = true, default-features = false }
raster = { package = "rasterrocket-render", path = "../raster", version = "2.4" }
color  = { package = "rasterrocket-color",  path = "../color",  version = "2.4" }
font   = { package = "rasterrocket-font",   path = "../font",   version = "2.4" }
pdf    = { package = "rasterrocket-parser", path = "../pdf",    version = "2.4" }
log    = { workspace = true }
# CCITT fax: a local fork of hayro-ccitt (crates/ccitt).
hayro-ccitt = { path = "../ccitt" }
# Pure-Rust JPEG 2000: a local fork of hayro-jpeg2000 (crates/jpeg2000).
hayro-jpeg2000 = { path = "../jpeg2000", default-features = false, features = ["simd"] }
zune-jpeg = { workspace = true }
zune-core = "0.5.1"
# JBIG2: a local fork of hayro-jbig2 (crates/jbig2).
hayro-jbig2 = { path = "../jbig2", default-features = false, features = ["std"] }
moxcms = { version = "0.9.2", features = ["options"] }
# Bidirectional text (UAX #9) and mirrored glyphs for synthesised appearances.
unicode-bidi = "0.3.18"
unicode-bidi-mirroring = "0.4.0"

[dev-dependencies]
env_logger       = { workspace = true }
jpeg-encoder     = "0.7"
encode           = { package = "rasterrocket-encode", path = "../encode", version = "2.4" }


[lints.rust]
unsafe_code     = "deny"
missing_docs    = "warn"
unused_results  = "warn"  # parity with workspace defaults; the local block overrides them
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
# Off: rustc's `unreachable_pub` requires crate-internal items of private
# modules to be `pub(crate)`, which this nursery lint calls redundant; the
# two cannot both hold, and `unreachable_pub` is the one that finds dead
# public surface.
redundant_pub_crate = "allow"
