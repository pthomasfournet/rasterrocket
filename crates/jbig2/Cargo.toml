# Local fork of hayro-jbig2 (https://github.com/LaurenzV/hayro), vendored
# from upstream commit 79926198e557e06fea8a8edcb0bc577eb0130ec5 (2026-10-23,
# crate version 0.3.1 plus unreleased changes).  Licence: Apache-2.0 OR MIT
# (see LICENSE-APACHE, LICENSE-MIT).  Changes made here are ours; see
# CHANGES.md.
[package]
name = "hayro-jbig2"
version = "0.3.1"
description = "A memory-safe, pure-Rust JBIG2 decoder (local fork)."
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
readme = "README.md"
publish = false
autotests = false

[dependencies]
fearless_simd = { version = "1.0.0", optional = true }
hayro-ccitt = { path = "../ccitt" }
image = { version = "0.25", default-features = false, optional = true }

[features]
default = ["std", "simd"]
std = []
# Enable SIMD via `fearless_simd` (halftone regions).
simd = ["fearless_simd", "std"]
# Integration with the `image` crate.
image = ["dep:image", "std"]

# Not part of rasterrocket's releases: the version stays that of the
# vendored upstream base.
[package.metadata.release]
release = false

# Upstream code is linted with clippy's defaults, minus findings in code we
# have not changed.
[lints.clippy]
too_many_arguments = "allow"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[[test]]
name = "tests"
path = "tests/main.rs"
