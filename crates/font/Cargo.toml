[package]
publish = false
name             = "rasterrocket-font"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
readme.workspace     = true
description          = "Font program parsing, glyph rasterisation and glyph cache for the rasterrocket PDF renderer"
keywords             = ["pdf", "font", "glyph", "truetype", "renderer"]
categories           = ["rendering", "multimedia::images"]

[dependencies]
raster   = { package = "rasterrocket-render", path = "../raster", version = "2.0" }
# Local forks (crates/read_fonts, crates/skrifa): font-program parsing and
# unhinted outlines for TrueType, OpenType, bare CFF and Type 1.  `agl`
# provides the Adobe Glyph List used to map glyph names to Unicode.
read-fonts = { path = "../read_fonts", version = "0.41.0", default-features = false, features = ["std", "agl"] }
skrifa     = { path = "../skrifa",     version = "0.44.0", default-features = false, features = ["std"] }
log        = { workspace = true }
# quick_cache gives a sharded concurrent LRU cache where reads do not
# require write locks (unlike dashmap + lru::LruCache, where get() takes
# &mut self and therefore serializes reads within each shard).
quick_cache = "0.7"
# Holds the parsed views of a font program next to the bytes they borrow.
self_cell   = "1.3"

[dev-dependencies]
font-test-data = { path = "../font_test_data" }

[lints]
workspace = true
