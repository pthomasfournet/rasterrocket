# Local fork of read-fonts (https://github.com/googlefonts/fontations,
# directory `read-fonts/`), vendored from upstream commit
# 1d1672367c7909013b4e366085d68d5ad612ee67 (2026-11-02, crate version 0.46.0).  Licence: MIT OR Apache-2.0 (see LICENSE-APACHE,
# LICENSE-MIT).  Changes made here are ours; see CHANGES.md.
[package]
name = "read-fonts"
version = "0.46.0"
description = "Reading OpenType font files."
readme = "README.md"
categories = ["text-processing", "parsing", "graphics"]

rust-version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/googlefonts/fontations"
publish = false

[package.metadata.docs.rs]
# To build locally:
# RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --features agl,libm,serde,std
features = ["agl", "libm", "serde", "std"]

[features]
std = ["font-types/std", "dep:foldhash"]
codegen_test = []
scaler_test = []
# experimental support for incremental font transfer (https://www.w3.org/TR/IFT/)
# code behind this feature does not honor semver and may break at any time.
ift = []
# Does nothing. The cubic outlines it once enabled are now always read.
spec_next = []
# Enables support for a new font API, as proposed at
# https://github.com/googlefonts/oxidize/pull/77
experimental_font_api = []
# Does nothing. Traversal was removed in #2087, but consumers still ask for
# this feature -- fontconfig's fc-fontations does, without using any of it --
# and cargo fails to resolve a feature that does not exist. Keeping it empty
# lets them upgrade before they edit their manifests.
experimental_traverse = []
default = ["std"]
serde = ["dep:serde", "font-types/serde"]
libm = ["dep:core_maths"]
# Support for mapping glyph names <-> unicode via the Adobe glyph list
agl = []

[dependencies]
foldhash = { version = "0.2.0", default-features = false, optional = true }
smallvec = { version = "1.13.1", default-features = false, features = [
    "const_generics",
    "union",
] }
font-types = { version = "0.12.7", features = ["bytemuck"] }
yoke = { version = "0.8.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"], optional = true }
core_maths = { version = "0.1", optional = true }
bytemuck = "1.14.0"
once_cell = { version = "1.21.4", default-features = false, features = [
    "alloc",
    "race",
] }

[dev-dependencies]
read-fonts = { path = "." }
font-test-data = { path = "../font_test_data" }
serde_json = "1.0"

# Not part of rasterrocket's releases: the version stays that of the
# vendored upstream base.
[package.metadata.release]
release = false

# Upstream code is linted with clippy's defaults, minus findings in code we
# have not changed.
[lints.clippy]
collapsible_match = "allow"
derivable_impls = "allow"
while_let_loop = "allow"
