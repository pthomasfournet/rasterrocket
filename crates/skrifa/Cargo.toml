# Local fork of skrifa (https://github.com/googlefonts/fontations,
# directory `skrifa/`), vendored from upstream commit
# b373cdbc6043a791fb23b3e0f413649458f5e63a (2026-07-04, crate version 0.44.0).  Licence: MIT OR Apache-2.0 (see LICENSE-APACHE,
# LICENSE-MIT).  Changes made here are ours; see CHANGES.md.
[package]
name = "skrifa"
version = "0.44.0"
description = "Metadata reader and glyph scaler for OpenType fonts."
readme = "README.md"
categories = ["text-processing", "parsing", "graphics"]

rust-version = "1.85"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/googlefonts/fontations"
publish = false

[package.metadata.docs.rs]
# To build locally:
# RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --all-features
all-features = true

[features]
default = ["std", "autohint_shaping"]
std = ["read-fonts/std"]
traversal = ["std", "read-fonts/experimental_traverse"]
# Enables extended shaping support for the autohinter. Enabled by default.
# This exists as a feature because shaping support is "best effort" and
# we want the ability to disable it for testing against FreeType.
autohint_shaping = []
# Enables experimental implementations of proposed changes to the spec
# as discussed at https://github.com/harfbuzz/boring-expansion-spec
spec_next = ["read-fonts/spec_next"]
libm = ["dep:core_maths", "read-fonts/libm"]

[dependencies]
read-fonts = { version = "0.41.0", path = "../read_fonts", default-features = false }
core_maths = { version = "0.1", optional = true }
bytemuck = "1.13.1"

[dev-dependencies]
font-test-data = { path = "../font_test_data" }
read-fonts = { version = "0.41.0", path = "../read_fonts", features = [
    "scaler_test",
    "serde",
] }
serde = "1.0"
serde_json = "1.0"
pretty_assertions = "1.3.0"
kurbo = "0.13.0"

# Not part of rasterrocket's releases: the version stays that of the
# vendored upstream base.
[package.metadata.release]
release = false

# Upstream code is linted with clippy's defaults, minus findings in code we
# have not changed.
[lints.clippy]
needless_return_with_question_mark = "allow"
unnecessary_unwrap = "allow"
