[package]
publish = false
name        = "rasterrocket-parser"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
readme.workspace      = true
description = "Lazy, zero-copy PDF file parser for the rasterrocket render pipeline"
keywords    = ["pdf", "parser", "mmap", "zero-copy", "document"]
categories  = ["parser-implementations", "encoding"]

[dependencies]
# zlib-rs pinned so the fallback inflater, whose partial output on corrupt
# streams is backend-dependent, is the same in every build.
flate2      = { version = "1", features = ["zlib-rs"] }
libdeflater = { version = "1", optional = true }
memmap2     = { version = "0.9" }
weezl       = { version = "0.2" }
brotli-decompressor = { version = "6" }
log         = { workspace = true }
# Standard security handler: RC4 and AES-CBC ciphers, MD5 and SHA-2 digests.
aes         = { version = "0.9" }
cbc         = { version = "0.2", features = ["alloc"] }
rc4         = { version = "0.2" }
md-5        = { version = "0.11" }
sha2        = { version = "0.11" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["libdeflate"]
libdeflate = ["dep:libdeflater"]

[lints]
workspace = true
