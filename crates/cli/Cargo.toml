[package]
name        = "rasterrocket-cli"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
readme               = "README.md"
publish     = false
description = "The rrocket command: renders PDF pages and comic archives to PPM, PGM, PBM or PNG files with pdftoppm-style flags. Pure Rust, zero Poppler."
keywords    = ["pdf", "raster", "cli", "pdftoppm", "renderer"]
categories  = ["command-line-utilities", "multimedia::images", "rendering"]

[[bin]]
name = "rrocket"
path = "src/main.rs"

[features]
# GPU features pull the path-only internal `rasterrocket-gpu` crate (publish = false)
# and are not available on crates.io.  Each feature forwards to the matching
# pdf_raster feature, which in turn wires to `dep:gpu` and the gpu-crate feature.
nvjpeg           = ["pdf_raster/nvjpeg"]
nvjpeg2k         = ["pdf_raster/nvjpeg2k"]
vaapi            = ["pdf_raster/vaapi"]
gpu-aa           = ["pdf_raster/gpu-aa"]
gpu-icc          = ["pdf_raster/gpu-icc"]
gpu-deskew       = ["pdf_raster/gpu-deskew"]
cache            = ["pdf_raster/cache"]
vulkan           = ["pdf_raster/vulkan"]
gpu-jpeg-huffman = ["pdf_raster/gpu-jpeg-huffman"]
gpu-validation   = ["pdf_raster/gpu-validation"]
# Bundled Noto fallback faces; on by default, off with --no-default-features.
default          = ["bundled-fonts"]
bundled-fonts    = ["pdf_raster/bundled-fonts"]

[dependencies]
pdf_raster  = { package = "rasterrocket",        path = "../pdf_raster", version = "1.5", default-features = false }
comic       = { package = "rasterrocket-comic",  path = "../comic",      version = "1.5" }
camera      = { package = "rasterrocket-camera", path = "../camera",     version = "1.5" }
encode      = { package = "rasterrocket-encode", path = "../encode",     version = "1.5" }
color       = { package = "rasterrocket-color",  path = "../color",      version = "1.5" }
raster      = { package = "rasterrocket-render", path = "../raster",     version = "1.5" }
clap        = { version = "4", features = ["derive"] }
rayon       = "1"
env_logger  = { workspace = true }
mimalloc    = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
# cli binary: unsafe_code only allowed in pdf_bridge (the FFI crate)
unsafe_code    = "deny"
missing_docs   = "allow"   # binary crate; public docs are not required
unused_results = "warn"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
# Off: rustc's `unreachable_pub` requires crate-internal items of private
# modules to be `pub(crate)`, which this nursery lint calls redundant; the
# two cannot both hold, and `unreachable_pub` is the one that finds dead
# public surface.
redundant_pub_crate = "allow"
