[package]
publish = false
name                 = "rasterrocket-comic"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
readme               = "README.md"
description          = "Comic-archive (.cbz/.cb7/.cbt) image input for the rasterrocket OCR pipeline"
keywords             = ["cbz", "comic", "ocr", "image", "archive"]
categories           = ["multimedia::images"]

[dependencies]
pdf_raster = { package = "rasterrocket",        path = "../pdf_raster", version = "1.5" }
color      = { package = "rasterrocket-color",  path = "../color",      version = "1.5" }
raster     = { package = "rasterrocket-render", path = "../raster",     version = "1.5" }
log        = { workspace = true }

# Archives — all pure-Rust, no system libs.
zip          = { workspace = true }
# Decoders only (LZMA/LZMA2 are always built in); archives are opened
# with an empty password, so AES support would never decrypt anything.
sevenz-rust2 = { workspace = true, features = ["bzip2", "ppmd"] }
tar          = { workspace = true }

# Image decode — pure-Rust, no system libs.
zune-jpeg  = "0.5"
png        = "0.18"
image-webp = { workspace = true }
tiff       = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `ArchiveWriter` builds the 7z fixtures.
sevenz-rust2 = { workspace = true, features = ["compress"] }
encode   = { package = "rasterrocket-encode", path = "../encode", version = "1.5" }

[lints]
workspace = true
