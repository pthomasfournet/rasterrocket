[package]
publish = false
name                 = "rasterrocket-comic"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
readme               = "README.md"
description          = "Comic-archive (.cbz/.cb7/.cbt/.cbr) image input for the rasterrocket OCR pipeline"
keywords             = ["cbz", "comic", "ocr", "image", "archive"]
categories           = ["multimedia::images"]

[dependencies]
pdf_raster = { package = "rasterrocket",        path = "../pdf_raster", version = "2.2", default-features = false }
color      = { package = "rasterrocket-color",  path = "../color",      version = "2.2" }
raster     = { package = "rasterrocket-render", path = "../raster",     version = "2.2" }
log        = { workspace = true }

# Archives — all pure-Rust, no system libs.
zip          = { workspace = true }
# Decoders only (LZMA/LZMA2 are always built in); archives are opened
# with an empty password, so AES support would never decrypt anything.
sevenz-rust2 = { workspace = true, features = ["bzip2", "ppmd"] }
# RAR 1.3 to 7, decode only (no writer, recovery or crypto).
rars         = { version = "0.12.4", default-features = false }
tar          = { workspace = true }

# Image decode — pure-Rust, no system libs.
zune-jpeg  = { workspace = true }
png        = "0.18"
image-webp = { workspace = true }
tiff       = { workspace = true }
jxl        = "0.8"
# AV1 pictures of AVIF pages: the workspace's local fork.
rav1d      = { path = "../rav1d", version = "1.1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

[features]
default = ["av1-asm"]
# The AV1 decoder's assembly kernels.  An x86 build then needs the nasm
# executable; without the feature the decoder is Rust alone.
av1-asm = ["rav1d/asm", "rav1d/asm_arm64_dotprod", "rav1d/asm_arm64_i8mm", "rav1d/asm_arm64_sve2"]

[dev-dependencies]
tempfile = { workspace = true }
# `ArchiveWriter` builds the 7z fixtures.
sevenz-rust2 = { workspace = true, features = ["compress"] }
# `Builder` writes the RAR fixtures.
rars         = { version = "0.12.4", default-features = false, features = ["write"] }
encode   = { package = "rasterrocket-encode", path = "../encode", version = "2.2" }

[lints]
workspace = true
