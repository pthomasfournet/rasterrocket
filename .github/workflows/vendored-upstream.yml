name: Vendored upstream

# Vendored crates (crates/*/UPSTREAM.toml) are path dependencies, so
# cargo-deny and cargo-audit never see their advisories and no upstream fix
# arrives on its own.  This job reports upstream commits, crates.io releases
# and RustSec advisories that appeared after each vendored base, and fails
# when there is any, so the Actions tab shows it.  It only reads public APIs.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check vendored crates against upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Report upstream changes since each vendored base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_vendored.py
