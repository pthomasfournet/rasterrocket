name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Overrides `.cargo/config.toml`'s `-C target-cpu=native`.  Hosted runners
  # vary in CPU and share the `target/` cache, so a native build restored on
  # a runner without the original CPU's extensions dies with SIGILL (as a
  # build script did for v1.4.1).  SIMD selection is runtime-dispatched, so
  # the baseline target loses no coverage.
  RUSTFLAGS: "-C target-cpu=generic"

jobs:
  # ── CPU-only build and test ─────────────────────────────────────────────────
  #
  # Builds and tests without any GPU features to verify that all CPU fallback
  # paths compile and work correctly on a standard GitHub-hosted runner (no
  # CUDA toolkit, no nvJPEG, no GPU hardware).  This catches regressions where
  # GPU-feature-gated code accidentally bleeds into the always-compiled paths.
  #
  # The runner is ubuntu-latest (x86-64), which has AVX2 but not AVX-512 —
  # representative of the entire Intel consumer desktop line (all Alder/Raptor/
  # Arrow Lake CPUs have AVX-512 disabled).  The AVX2 and scalar fallback tiers
  # are exercised on every push.
  cpu-only:
    name: CPU-only (no GPU features)
    runs-on: ubuntu-latest
    env:
      # About fifty integration-test binaries are linked; line tables keep
      # panic backtraces readable at half the size of full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6

      # The classification logic of the reference-comparison harnesses; the
      # harnesses themselves need reference renderers the runner lacks.
      - name: Test the comparison harnesses' expectations registry
        run: python3 -I tests/compare/test_expectations.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # crates/pdf_raster/tests/encryption.rs builds its encrypted fixtures
      # with qpdf at test time and skips without it.
      # nasm assembles the x86 kernels of the AV1 decoder (crates/rav1d,
      # behind AVIF comic pages).
      # liblcms2-utils provides transicc, the independent CMM the output
      # profile conversion is checked against.
      - name: Install qpdf, nasm and transicc
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qpdf nasm liblcms2-utils

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-generic-cpu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-generic-cpu-

      - name: Build CLI (CPU-only, release)
        run: cargo build --release -p rasterrocket-cli

      - name: Test rasterrocket-interp (unit suite + decoder property harness)
        run: cargo test -p rasterrocket-interp --tests

      - name: Test the output profile conversion against transicc (ΔE00 ≤ 1)
        run: cargo test -p rasterrocket-interp --release --test output_profile_transicc -- --include-ignored

      - name: Test rasterrocket-render (full unit suite — SIMD dispatch, fill, blend, popcnt)
        run: cargo test -p rasterrocket-render --lib

      - name: Test rasterrocket-gpu (CMYK matrix — AVX2 and scalar parity)
        run: cargo test -p rasterrocket-gpu --lib -- cmyk

      # The integration suites assemble their PDFs in memory and assert
      # rendered pixels; suites that need the gitignored corpus skip.
      - name: Test rasterrocket (unit suite + in-memory rendering suites, encryption)
        run: cargo test -p rasterrocket --tests

      - name: Test rasterrocket-parser
        run: cargo test -p rasterrocket-parser --lib

      - name: Test vendored JPEG 2000 decoder (upstream suite + equivalence)
        run: cargo test -p hayro-jpeg2000 --features image --release

      - name: Test vendored JBIG2 and CCITT decoders
        run: cargo test -p hayro-jbig2 -p hayro-ccitt --release

      - name: Test vendored JPEG decoder (upstream suite + fork tests)
        run: cargo test -p zune-jpeg --release

      # The fork's own tests; its use by the comic crate is tested there.
      # The second command keeps the build without assembly, which needs no
      # nasm, compiling.
      - name: Test vendored AV1 decoder, check it without assembly
        run: |
          cargo test -p rav1d --release --lib
          cargo check -p rav1d --no-default-features --features bitdepth_8,bitdepth_16
          cargo check -p rasterrocket-cli --no-default-features --features bundled-fonts

      - name: Test rasterrocket-cli (argument handling, end-to-end runs of the binary)
        run: cargo test -p rasterrocket-cli

      - name: Check bench binaries
        run: cargo check -p bench --bins

      - name: Test rasterrocket-font (font programs, glyph rasteriser)
        run: cargo test -p rasterrocket-font

      - name: Test vendored read-fonts / skrifa / harfrust forks (upstream suites)
        run: cargo test -p read-fonts -p skrifa -p harfrust --lib

      - name: Test rasterrocket-camera (stages, no-panic sweep)
        run: cargo test -p rasterrocket-camera --release

      - name: Test rasterrocket-color, rasterrocket-encode, rasterrocket-comic
        run: cargo test -p rasterrocket-color -p rasterrocket-encode -p rasterrocket-comic

      # The cache is saved after a successful run.  Test executables relink
      # in seconds; leaving them out keeps it within the repository's quota.
      # The script keeps the build-script executables, so a cache hit runs
      # none, and the release rrocket, which a cache hit then does not relink.
      - name: Drop test executables from the build cache
        run: |
          bash scripts/ci_prune_test_executables.sh target/debug
          bash scripts/ci_prune_test_executables.sh --keep rrocket target/release

  # ── aarch64 cross-check ───────────────────────────────────────────────────
  #
  # Cross-compiles (no execution) the CPU-only crates for aarch64 to keep the
  # NEON paths and cfg gates honest.  Uses `cargo check` only — no GPU features,
  # no CUDA, no execution.  A `cargo check` failure here means an aarch64
  # regression was introduced on x86-64.
  aarch64-check:
    name: aarch64 cross-check (NEON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install stable toolchain + aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-generic-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-generic-aarch64-

      - name: Check rasterrocket-render (stable, NEON)
        run: cargo check -p rasterrocket-render --target aarch64-unknown-linux-gnu

      - name: Check rasterrocket-gpu (stable, NEON CMYK path)
        run: cargo check -p rasterrocket-gpu --target aarch64-unknown-linux-gnu

      # rasterrocket's parser compiles the vendored libdeflate C sources,
      # which needs a cross C compiler (gcc-aarch64-linux-gnu).
      - name: Install aarch64 cross C toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Check rasterrocket (stable, NEON deskew path)
        run: cargo check -p rasterrocket --target aarch64-unknown-linux-gnu

  # ── Clippy on every platform, and the platform-dependent tests ──────────
  #
  # Code gated on `target_arch = "aarch64"` (the NEON tiers) or on the
  # target OS (memory probes, file hints, system font discovery) compiles
  # only there, so each platform is linted on its own runner; test targets
  # are linted one crate per invocation, since a combined `--all-targets`
  # run exceeds runner memory.  The arm64 Linux leg also executes the NEON
  # tiers, which the cross-check above only compiles; the macOS and Windows
  # legs run the renderer, interpreter and library suites, whose file,
  # font and memory handling depends on the OS, and Windows the CLI's.
  platforms:
    name: Clippy and platform tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Line tables keep panic backtraces readable at half the size of full
      # debug info (on Windows, of the PDB files the linker writes).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        # Git Bash on Windows: a multi-line step fails at its first failing
        # command, which PowerShell does not guarantee for native programs.
        shell: bash
    steps:
      # Git for Windows checks text files out with CRLF line ends; the
      # sources and the fixtures the tests embed are read byte for byte.
      - name: Keep LF line ends (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-platforms-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-platforms-

      # The arm64 legs assemble the decoder's .S kernels with the C compiler.
      - name: Install nasm (x86-64 Linux)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nasm

      # Chocolatey installs nasm outside PATH.
      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          echo 'C:\Program Files\NASM' >> "$GITHUB_PATH"

      - name: Clippy (no GPU features)
        run: cargo clippy -p rasterrocket-color -p rasterrocket-encode -p rasterrocket-comic -p rasterrocket-parser -p rasterrocket-font -p rasterrocket-interp -p rasterrocket-render -p rasterrocket-gpu -p rasterrocket -- -D warnings

      - name: Clippy (rasterrocket-color, -encode, -comic tests)
        run: cargo clippy -p rasterrocket-color -p rasterrocket-encode -p rasterrocket-comic --tests -- -D warnings

      - name: Clippy (rasterrocket-parser tests)
        run: cargo clippy -p rasterrocket-parser --tests -- -D warnings

      - name: Clippy (rasterrocket-render tests)
        run: cargo clippy -p rasterrocket-render --tests -- -D warnings

      - name: Clippy (rasterrocket-font tests)
        run: cargo clippy -p rasterrocket-font --tests -- -D warnings

      - name: Clippy (rasterrocket-interp tests)
        run: cargo clippy -p rasterrocket-interp --tests -- -D warnings

      - name: Clippy (rasterrocket-interp, gpu-icc tests)
        run: cargo clippy -p rasterrocket-interp --features gpu-icc --tests -- -D warnings

      - name: Clippy (rasterrocket tests)
        run: cargo clippy -p rasterrocket --tests -- -D warnings

      - name: Clippy (rasterrocket-cli tests)
        run: cargo clippy -p rasterrocket-cli --tests -- -D warnings

      - name: Clippy (rasterrocket-camera, lib and tests)
        run: cargo clippy -p rasterrocket-camera --tests -- -D warnings

      - name: Clippy (rasterrocket-gpu, cache and gpu-validation, lib and tests)
        run: cargo clippy -p rasterrocket-gpu --features cache,gpu-validation --tests -- -D warnings

      # The vendored forks at clippy's defaults, one package at a time so
      # features do not unify across them: library and tests, with the
      # `image` feature their integration tests require; read-fonts' and
      # skrifa's libraries only, their test code being upstream's, and
      # rav1d's library, its tests being in the library.
      - name: Clippy (vendored forks)
        run: |
          cargo clippy -p hayro-jpeg2000 --features image --tests -- -D warnings
          cargo clippy -p hayro-jbig2 --features image --tests -- -D warnings
          cargo clippy -p hayro-ccitt --tests -- -D warnings
          cargo clippy -p harfrust --tests -- -D warnings
          cargo clippy -p zune-jpeg --tests -- -D warnings
          cargo clippy -p read-fonts -- -D warnings
          cargo clippy -p skrifa -- -D warnings
          cargo clippy -p rav1d -- -D warnings

      - name: Test rasterrocket-render (NEON tiers on arm64, SIMD dispatch)
        if: runner.os != 'Linux' || runner.arch == 'ARM64'
        run: cargo test -p rasterrocket-render --lib

      - name: Test rasterrocket-gpu (NEON CMYK path)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: cargo test -p rasterrocket-gpu --lib -- cmyk

      - name: Test rasterrocket (NEON deskew rotate + parity)
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: cargo test -p rasterrocket --lib

      - name: Test rasterrocket-font (system font discovery)
        if: runner.os != 'Linux'
        run: cargo test -p rasterrocket-font --lib

      # As on Linux: the integration suites assemble their PDFs in memory,
      # and the ones that need the gitignored corpus skip.
      - name: Test rasterrocket-interp (unit suite, system fonts, predefined CMaps)
        if: runner.os != 'Linux'
        run: cargo test -p rasterrocket-interp --tests

      - name: Test rasterrocket (unit suite + in-memory rendering suites)
        if: runner.os != 'Linux'
        run: cargo test -p rasterrocket --tests

      - name: Test rasterrocket-cli (memory probe, RAM output)
        if: runner.os == 'macOS'
        run: cargo test -p rasterrocket-cli --bin rrocket -- ram

      - name: Test rasterrocket-cli (argument handling, end-to-end runs of the binary)
        if: runner.os == 'Windows'
        run: cargo test -p rasterrocket-cli

      # The --print tests print to Microsoft Print to PDF where the runner
      # has it and skip otherwise; this shows which, and the printers.
      # pipefail: the step fails with cargo, not with grep alone.
      - name: Printers and the Print to PDF tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          powershell -NoProfile -Command "Get-Printer | Format-Table -AutoSize Name, PortName, DriverName" || echo "the printers could not be listed"
          cargo test -p rasterrocket-cli --bin rrocket --test end_to_end -- print_to_pdf --nocapture 2>&1 | grep -E "ran$|skipped:|test result"

      - name: Test rasterrocket-parser
        if: runner.os == 'Windows'
        run: cargo test -p rasterrocket-parser --lib

      - name: Test rasterrocket-color, -encode, -comic (AV1 assembly kernels)
        if: runner.os == 'Windows'
        run: cargo test -p rasterrocket-color -p rasterrocket-encode -p rasterrocket-comic

      # As in the CPU-only job: test executables stay out of the cache.
      - name: Drop test executables from the build cache
        run: bash scripts/ci_prune_test_executables.sh target/debug

  # ── Fuzz target build ─────────────────────────────────────────────────────
  #
  # `fuzz/` is a workspace of its own (cargo-fuzz builds it on nightly with
  # sanitizer flags), so no workspace build compiles it.  Building every
  # target here makes a package rename or an API change in a fuzzed crate
  # fail on push instead of at the next fuzzing session.
  fuzz-build:
    name: Fuzz targets (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      # The fuzz workspace keeps its own lock file, which a release bump of
      # the workspace crates leaves stale; the build below would rewrite it
      # silently.
      - name: Check the fuzz lock file is current
        run: cargo +nightly metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null

      - name: Build fuzz targets
        working-directory: fuzz
        # cargo-fuzz defaults to the target it was itself built for, and the
        # prebuilt binary the install step fetches is a musl build: name the
        # glibc target, where the sanitizer runtime and the toolchain's std are.
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu

  # ── Minimum supported toolchain ───────────────────────────────────────────
  # Every crate declares rust-version 1.100; the other jobs build with the
  # latest stable, so this one holds the declared floor.
  msrv:
    name: Minimum toolchain (Rust 1.100)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.100
      - name: Install nasm
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nasm
      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
      - name: Check the CLI, the library and the camera crate
        run: cargo check --locked -p rasterrocket-cli -p rasterrocket -p rasterrocket-camera

  # ── Direct3D 12 backend on the pinned WARP ──────────────────────────────
  #
  # The hosted runner has no GPU, so the D3D12 tests run on the WARP
  # software adapter.  The pinned d3d10warp.dll (scripts/fetch_warp.ps1) is
  # copied beside each test binary, the library's unit tests included, which
  # the loader prefers to the system copy; `pinned_warp_is_the_one_loaded`
  # and the unit tests' `test_backend` fail when the system one loads
  # instead.  slangc and DXC are the exact versions the build requires.
  d3d12-warp:
    name: Direct3D 12 on pinned WARP (windows-latest)
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      PDF_RASTER_D3D12_DEVICE: warp
      PDF_RASTER_REQUIRE_D3D12: "1"
      PDF_RASTER_D3D12_DEBUG: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The debug layer (d3d12SDKLayers.dll) ships in the Graphics Tools
      # optional feature.  With PDF_RASTER_D3D12_DEBUG=1 the tests fail when
      # the layer is off, and every page and transfer fails on a stored
      # validation error.
      - name: Install Graphics Tools (the D3D12 debug layer)
        shell: powershell
        run: |
          $name = 'Tools.Graphics.DirectX~~~~0.0.1.0'
          if ((Get-WindowsCapability -Online -Name $name).State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $name | Out-Null
          }
          if (-not (Test-Path "$env:WINDIR\System32\d3d12SDKLayers.dll")) { throw 'the D3D12 debug layer is not installed' }

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-d3d12-warp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-d3d12-warp-

      # The archives' SHA-256 are the digests of the release assets.
      - name: Install slangc 2026.20 and DXC 1.9.2609
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $slang = Join-Path $tools 'slang.zip'
          Invoke-WebRequest -UseBasicParsing -OutFile $slang -Uri 'https://github.com/shader-slang/slang/releases/download/v2026.20/slang-2026.20-windows-x86_64.zip'
          if ((Get-FileHash -Algorithm SHA256 $slang).Hash.ToLowerInvariant() -ne 'e6dd32bbddf1720ebb4e679d55e9635ce792865a5bd84f3d2cd9af28647c0174') { throw 'slang archive hash mismatch' }
          Expand-Archive -Path $slang -DestinationPath (Join-Path $tools 'slang')
          $dxc = Join-Path $tools 'dxc.zip'
          Invoke-WebRequest -UseBasicParsing -OutFile $dxc -Uri 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip'
          if ((Get-FileHash -Algorithm SHA256 $dxc).Hash.ToLowerInvariant() -ne 'ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1') { throw 'dxc archive hash mismatch' }
          Expand-Archive -Path $dxc -DestinationPath (Join-Path $tools 'dxc')
          "SLANGC=$(Join-Path $tools 'slang\bin\slangc.exe')" >> $env:GITHUB_ENV
          "DXC=$(Join-Path $tools 'dxc\bin\x64\dxc.exe')" >> $env:GITHUB_ENV

      # The Windows-only code (`cfg(windows)`) is linted only here.
      - name: Clippy with the d3d12 feature
        run: |
          cargo clippy --locked -p rasterrocket-gpu --features d3d12,cache --tests -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "clippy rasterrocket-gpu failed ($LASTEXITCODE)" }
          cargo clippy --locked -p rasterrocket --features d3d12,gpu-icc,cache --tests -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "clippy rasterrocket failed ($LASTEXITCODE)" }
          cargo clippy --locked -p rasterrocket-cli --features d3d12 --tests -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "clippy rasterrocket-cli failed ($LASTEXITCODE)" }

      - name: Build the CLI with the d3d12 feature
        run: cargo build --locked --release -p rasterrocket-cli --features d3d12

      # Cargo places a test binary by its own layout, so the WARP copy goes
      # to the directory of the binary the build reports.
      - name: Build the D3D12 tests
        run: |
          $json = cargo test --locked --release -p rasterrocket-gpu --features d3d12,cache --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw "cargo test --no-run failed ($LASTEXITCODE)" }
          $exes = @($json | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.executable -and ($_.target.name -like 'd3d12_*' -or ($_.target.kind -contains 'lib' -and $_.profile.test)) } |
            ForEach-Object { $_.executable })
          if ($exes.Count -eq 0) { throw 'no D3D12 test binary was built' }
          $dirs = @($exes | ForEach-Object { Split-Path -Parent $_ } | Sort-Object -Unique)
          foreach ($dir in $dirs) { ./scripts/fetch_warp.ps1 $dir }

      - name: Build the session-level parity tests
        run: |
          $json = cargo test --locked --release -p rasterrocket --features d3d12,gpu-icc --test gpu_page_render_parity --test gpu_icc_render_parity --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { throw "cargo test --no-run failed ($LASTEXITCODE)" }
          $exes = @($json | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.executable -and $_.target.name -in 'gpu_page_render_parity', 'gpu_icc_render_parity' } |
            ForEach-Object { $_.executable })
          if ($exes.Count -ne 2) { throw "expected 2 parity test binaries, built $($exes.Count)" }
          $dirs = @($exes | ForEach-Object { Split-Path -Parent $_ } | Sort-Object -Unique)
          foreach ($dir in $dirs) { ./scripts/fetch_warp.ps1 $dir }

      - name: Test the D3D12 backend on the pinned WARP
        env:
          RR_WARP_VERSION: 1.0.22.0
        run: cargo test --locked --release -p rasterrocket-gpu --features d3d12,cache --test 'd3d12_*' -- --nocapture --test-threads=1

      - name: Test the D3D12 backend's unit tests
        env:
          RR_WARP_VERSION: 1.0.22.0
        run: cargo test --locked --release -p rasterrocket-gpu --features d3d12,cache --lib -- d3d12

      # Byte-identity of GPU pages and of the ICC conversion against the CPU.
      # The corpus tests skip here, the fixtures not being in the repository
      # (a missing fixture fails only under PDF_RASTER_REQUIRE_FIXTURES, which
      # this job leaves unset); the synthetic-page tests run, and
      # PDF_RASTER_REQUIRE_D3D12 makes a session that does not open a failure.
      - name: Test GPU page and ICC parity on the pinned WARP
        env:
          RR_WARP_VERSION: 1.0.22.0
          RR_GPU_PAGE_POLICY: d3d12
        run: cargo test --locked --release -p rasterrocket --features d3d12,gpu-icc --test gpu_page_render_parity --test gpu_icc_render_parity -- --nocapture --test-threads=1

  # ── Format and spelling check ─────────────────────────────────────────────
  fmt:
    name: Formatting and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Default members are every member but pdf_bridge
        run: |
          cargo metadata --format-version 1 --no-deps | jq -e '
            (.workspace_default_members | sort) as $default
            | [.workspace_members[] | select(test("pdf_bridge") | not)] | sort == $default'
      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos
      # Allowed PDF and font terms and the excluded vendored trees are in
      # _typos.toml.
      - run: typos
