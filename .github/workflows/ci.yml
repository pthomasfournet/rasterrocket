name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Overrides `.cargo/config.toml`'s `-C target-cpu=native`.  Hosted runners
  # vary in CPU and share the `target/` cache, so a native build restored on
  # a runner without the original CPU's extensions dies with SIGILL (as a
  # build script did for v1.4.1).  SIMD selection is runtime-dispatched, so
  # the baseline target loses no coverage.
  RUSTFLAGS: "-C target-cpu=generic"

jobs:
  # ── CPU-only build and test ─────────────────────────────────────────────────
  #
  # Builds and tests without any GPU features to verify that all CPU fallback
  # paths compile and work correctly on a standard GitHub-hosted runner (no
  # CUDA toolkit, no nvJPEG, no GPU hardware).  This catches regressions where
  # GPU-feature-gated code accidentally bleeds into the always-compiled paths.
  #
  # The runner is ubuntu-latest (x86-64), which has AVX2 but not AVX-512 —
  # representative of the entire Intel consumer desktop line (all Alder/Raptor/
  # Arrow Lake CPUs have AVX-512 disabled).  The AVX2 and scalar fallback tiers
  # are exercised on every push.
  cpu-only:
    name: CPU-only (no GPU features)
    runs-on: ubuntu-latest
    env:
      # About fifty integration-test binaries are linked; line tables keep
      # panic backtraces readable at half the size of full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # crates/pdf_raster/tests/encryption.rs builds its encrypted fixtures
      # with qpdf at test time and skips without it.
      - name: Install qpdf
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qpdf

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-generic-cpu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-generic-cpu-

      - name: Build CLI (CPU-only, release)
        run: cargo build --release -p rasterrocket-cli

      - name: Test rasterrocket-interp (unit suite + decoder property harness)
        run: cargo test -p rasterrocket-interp --tests

      - name: Test rasterrocket-interp (GPU fill host twin vs CPU fill, gpu-aa; no device)
        run: cargo test -p rasterrocket-interp --features gpu-aa --lib -- gpu_ops

      - name: Test rasterrocket-render (full unit suite — SIMD dispatch, fill, blend, popcnt)
        run: cargo test -p rasterrocket-render --lib

      - name: Test rasterrocket-gpu (CMYK matrix — AVX2 and scalar parity)
        run: cargo test -p rasterrocket-gpu --lib -- cmyk

      - name: Test rasterrocket-gpu (parallel-Huffman JPEG decoder, gpu-jpeg-huffman)
        run: cargo test -p rasterrocket-gpu --features cache,gpu-validation,gpu-jpeg-huffman --lib -- jpeg_decoder huffman

      # The integration suites assemble their PDFs in memory and assert
      # rendered pixels; suites that need the gitignored corpus skip.
      - name: Test rasterrocket (unit suite + in-memory rendering suites, encryption)
        run: cargo test -p rasterrocket --tests

      - name: Test rasterrocket-parser
        run: cargo test -p rasterrocket-parser --lib

      - name: Test vendored JPEG 2000 decoder (upstream suite + equivalence)
        run: cargo test -p hayro-jpeg2000 --features image --release

      - name: Test vendored JBIG2 and CCITT decoders
        run: cargo test -p hayro-jbig2 -p hayro-ccitt --release

      - name: Test rasterrocket-cli (argument handling, end-to-end runs of the binary)
        run: cargo test -p rasterrocket-cli

      - name: Check bench binaries
        run: cargo check -p bench --bins

      - name: Test rasterrocket-font (font programs, glyph rasteriser)
        run: cargo test -p rasterrocket-font

      - name: Test vendored read-fonts / skrifa forks (upstream suites)
        run: cargo test -p read-fonts -p skrifa --lib

      - name: Test rasterrocket-camera (stages, no-panic sweep)
        run: cargo test -p rasterrocket-camera --release

      - name: Test rasterrocket-color, rasterrocket-encode, rasterrocket-comic
        run: cargo test -p rasterrocket-color -p rasterrocket-encode -p rasterrocket-comic

      - name: Clippy (no GPU features)
        run: cargo clippy -p rasterrocket-color -p rasterrocket-encode -p rasterrocket-comic -p rasterrocket-parser -p rasterrocket-font -p rasterrocket-interp -p rasterrocket-render -p rasterrocket-gpu -p rasterrocket -- -D warnings

      # Test targets are linted one crate per invocation: a combined
      # `--all-targets` run exceeds runner memory.
      # Three small crates whose test targets fit in one invocation.
      - name: Clippy (rasterrocket-color, -encode, -comic tests)
        run: cargo clippy -p rasterrocket-color -p rasterrocket-encode -p rasterrocket-comic --tests -- -D warnings

      - name: Clippy (rasterrocket-parser tests)
        run: cargo clippy -p rasterrocket-parser --tests -- -D warnings

      - name: Clippy (rasterrocket-render tests)
        run: cargo clippy -p rasterrocket-render --tests -- -D warnings

      - name: Clippy (rasterrocket-font tests)
        run: cargo clippy -p rasterrocket-font --tests -- -D warnings

      - name: Clippy (rasterrocket-interp tests)
        run: cargo clippy -p rasterrocket-interp --tests -- -D warnings

      - name: Clippy (rasterrocket tests)
        run: cargo clippy -p rasterrocket --tests -- -D warnings

      - name: Clippy (rasterrocket-cli tests)
        run: cargo clippy -p rasterrocket-cli --tests -- -D warnings

      - name: Clippy (rasterrocket-camera, lib and tests)
        run: cargo clippy -p rasterrocket-camera --tests -- -D warnings

      - name: Clippy (rasterrocket-gpu, gpu-jpeg-huffman)
        run: cargo clippy -p rasterrocket-gpu --features cache,gpu-validation,gpu-jpeg-huffman --tests -- -D warnings

      # The cache is saved after a successful run.  Test executables relink
      # in seconds; leaving them out keeps it within the repository's quota.
      - name: Drop test executables from the build cache
        run: find target/debug/deps -maxdepth 1 -type f -executable ! -name '*.*' -delete

  # ── aarch64 cross-check ───────────────────────────────────────────────────
  #
  # Cross-compiles (no execution) the CPU-only crates for aarch64 to keep the
  # NEON paths and cfg gates honest.  Uses `cargo check` only — no GPU features,
  # no CUDA, no execution.  A `cargo check` failure here means an aarch64
  # regression was introduced on x86-64.
  #
  # The `nightly-sve2` feature is also checked on nightly to keep the SVE2
  # intrinsic code compilable as the nightly stdarch evolves.
  aarch64-check:
    name: aarch64 cross-check (NEON + SVE2 nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install stable toolchain + aarch64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install nightly toolchain + aarch64 target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-generic-aarch64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-generic-aarch64-

      - name: Check rasterrocket-render (stable, NEON)
        run: cargo check -p rasterrocket-render --target aarch64-unknown-linux-gnu

      - name: Check rasterrocket-render (nightly, NEON + SVE2)
        run: cargo +nightly check -p rasterrocket-render --target aarch64-unknown-linux-gnu --features nightly-sve2

      - name: Check rasterrocket-gpu (stable, NEON CMYK path)
        run: cargo check -p rasterrocket-gpu --target aarch64-unknown-linux-gnu

      # rasterrocket's parser compiles the vendored libdeflate C sources,
      # which needs a cross C compiler (gcc-aarch64-linux-gnu).
      - name: Install aarch64 cross C toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Check rasterrocket (stable, NEON deskew path)
        run: cargo check -p rasterrocket --target aarch64-unknown-linux-gnu

  # ── aarch64 native execution ──────────────────────────────────────────────
  #
  # Runs the NEON test suites on a native arm64 hosted runner (free for
  # public repositories).  The cross-check job above only compiles; this job
  # actually executes the NEON tiers — the rotate-row parity test, the glyph
  # unpack kernels, and the coverage tiers — which otherwise ship untested.
  aarch64-test:
    name: aarch64 native tests (NEON execution)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-generic-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-generic-arm64-cargo-

      - name: Test rasterrocket-render (NEON tiers)
        run: cargo test -p rasterrocket-render --lib

      - name: Test rasterrocket-gpu (NEON CMYK path)
        run: cargo test -p rasterrocket-gpu --lib -- cmyk

      - name: Test rasterrocket (NEON deskew rotate + parity)
        run: cargo test -p rasterrocket --lib

  # ── Fuzz target build ─────────────────────────────────────────────────────
  #
  # `fuzz/` is a workspace of its own (cargo-fuzz builds it on nightly with
  # sanitizer flags), so no workspace build compiles it.  Building every
  # target here makes a package rename or an API change in a fuzzed crate
  # fail on push instead of at the next fuzzing session.
  fuzz-build:
    name: Fuzz targets (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Build fuzz targets
        working-directory: fuzz
        # cargo-fuzz defaults to the target it was itself built for, and the
        # prebuilt binary the install step fetches is a musl build: name the
        # glibc target, where the sanitizer runtime and the toolchain's std are.
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu

  # ── Format and spelling check ─────────────────────────────────────────────
  fmt:
    name: Formatting and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos
      # Allowed PDF and font terms and the excluded vendored trees are in
      # _typos.toml.
      - run: typos
